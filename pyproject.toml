[project]
name = "case-copilot"
version = "0.1.0"
description = "Copiloto de Casos: agente que investiga casos de clientes y propone resoluciones con aprobación humana."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.15",
    "pyright[nodejs]>=1.1.414",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Dependency deprecation, not ours: starlette.testclient (imported by fastapi.testclient)
# asks for httpx2 instead of httpx. Scoped to that category and module only.
# Revisit when upgrading FastAPI/Starlette.
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
]

[tool.pyright]
include = ["backend", "data", "tests", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# Critical modules (masking, approval gate, output validator, executor) join this list
# as their specs create them.
strict = []

[tool.importlinter]
root_package = "backend"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "mock_core layers: api -> repository -> domain"
type = "layers"
layers = ["backend.mock_core.api", "backend.mock_core.repository", "backend.domain"]

[[tool.importlinter.contracts]]
name = "domain is framework-free"
type = "forbidden"
source_modules = ["backend.domain"]
forbidden_modules = ["fastapi", "uvicorn", "backend.mock_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
