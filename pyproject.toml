[project]
name = "case-copilot"
version = "0.1.0"
description = "Copiloto de Casos: agente que investiga casos de clientes y propone resoluciones con aprobación humana."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.115",
    "mcp>=2.3.0",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.15",
    "pyright[nodejs]>=1.1.414",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Dependency deprecation, not ours: starlette.testclient (imported by fastapi.testclient)
# asks for httpx2 instead of httpx. Scoped to that category and module only.
# Revisit when upgrading FastAPI/Starlette.
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
]

[tool.pyright]
include = ["backend", "mcp_server", "evals", "data", "tests", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# Critical modules (masking, approval gate, output validator, executor) join this list
# as their specs create them.
strict = [
    "backend/security/masking.py",
    "backend/security/unmask.py",
    "backend/security/untrusted.py",
    "backend/agent/validators.py",
    "backend/agent/prompt.py",
    "backend/executor/executor.py",
]

[tool.importlinter]
root_packages = ["backend", "mcp_server", "evals"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "mock_core layers: api -> repository -> domain"
type = "layers"
layers = ["backend.mock_core.api", "backend.mock_core.repository", "backend.domain"]

[[tool.importlinter.contracts]]
name = "domain is framework-free"
type = "forbidden"
source_modules = ["backend.domain"]
forbidden_modules = ["fastapi", "uvicorn", "backend.mock_core"]

# Invariant 4: only the executor may import unmask.
[[tool.importlinter.contracts]]
name = "unmask is protected"
type = "protected"
protected_modules = ["backend.security.unmask"]
allowed_importers = ["backend.executor"]

[[tool.importlinter.contracts]]
name = "agent is pure: no store, executor, unmask, evals or API"
type = "forbidden"
source_modules = ["backend.agent"]
forbidden_modules = [
    "backend.store",
    "backend.executor",
    "backend.security.unmask",
    "evals",
    "backend.mock_core.api",
    "backend.llm",
]

[[tool.importlinter.contracts]]
name = "llm adapter is isolated: no store, executor, unmask or evals"
type = "forbidden"
source_modules = ["backend.llm"]
forbidden_modules = ["backend.store", "backend.executor", "backend.security.unmask", "evals"]

[[tool.importlinter.contracts]]
name = "orchestrator never executes or unmasks"
type = "forbidden"
source_modules = ["backend.orchestrator"]
forbidden_modules = ["backend.executor", "backend.security.unmask"]

[[tool.importlinter.contracts]]
name = "the agent never imports eval labels"
type = "forbidden"
source_modules = ["backend", "mcp_server"]
forbidden_modules = ["evals"]

[[tool.importlinter.contracts]]
name = "policies are independent of the core and the MCP"
type = "forbidden"
source_modules = ["backend.policies"]
forbidden_modules = ["mcp_server", "backend.mock_core", "backend.security.unmask"]

[[tool.importlinter.contracts]]
name = "mcp_server reads the repository, never the API or unmask"
type = "forbidden"
source_modules = ["mcp_server"]
forbidden_modules = ["backend.mock_core.api", "fastapi", "backend.security.unmask"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "mcp_server", "tests"]
